<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid slice">
  <!-- t3+ sample composer image: a static diagonal spectrum band on a dark field. Original artwork. -->
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07080c"/>
      <stop offset="1" stop-color="#10131c"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a5bd7" stop-opacity="0"/>
      <stop offset="0.22" stop-color="#3b82f6"/>
      <stop offset="0.42" stop-color="#5ec8d8"/>
      <stop offset="0.55" stop-color="#f5d76e"/>
      <stop offset="0.68" stop-color="#f97316"/>
      <stop offset="0.82" stop-color="#dc2626"/>
      <stop offset="1" stop-color="#7f1d1d" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#000" fill-opacity="0.45"/>
    </pattern>
  </defs>
  <rect width="1600" height="600" fill="url(#field)"/>
  <g transform="rotate(-17 800 300)" filter="url(#soft)">
    <rect x="-300" y="230" width="2200" height="170" fill="url(#band)" opacity="0.9"/>
    <rect x="-300" y="292" width="2200" height="26" fill="#fff4d6" opacity="0.35"/>
  </g>
  <rect width="1600" height="600" fill="url(#dots)"/>
</svg>
